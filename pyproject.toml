[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "ftlm-gpu"
version = "2.0.0"
description = "GPU-accelerated finite-temperature Lanczos method (FTLM) for spin Hamiltonians"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Shadan Ghassemi Tabrizi" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8"]
keywords = ["finite-temperature Lanczos", "FTLM", "spin Hamiltonian", "Heisenberg model",
            "GPU", "CUDA", "exact diagonalization", "magnetism"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Physics",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.optional-dependencies]
cuda12 = ["cupy-cuda12x>=12"]
cuda11 = ["cupy-cuda11x>=12"]
test = ["pytest"]

[project.scripts]
ftlm-gpu = "ftlm_gpu.__main__:main"

[project.urls]
Repository = "https://github.com/ghasdeke/ftlm-gpu"

[tool.hatch.build.targets.wheel]
packages = ["python/ftlm_gpu"]

# The CUDA device code is shared with the MATLAB MEX gateway and lives in
# cuda/; it is copied into the wheel next to the Python modules.
[tool.hatch.build.targets.wheel.force-include]
"cuda/ftlm_kernels.cuh" = "ftlm_gpu/cuda/ftlm_kernels.cuh"

[tool.hatch.build.targets.sdist]
include = ["python/ftlm_gpu", "python/tests", "cuda/ftlm_kernels.cuh",
           "examples/python", "README.md", "LICENSE", "NOTICE", "CITATION.cff"]
